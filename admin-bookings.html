<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Bookings - Maid & Nanny Services</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</head>
<body data-page="admin-bookings">
    <section class="container page-section">
        <div class="page-header">
            <h1>All Bookings</h1>
            <p>Manage platform bookings</p>
        </div>

        <div class="card">
            <div class="card-header">Booking List</div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Helper</th>
                            <th>Service Type</th>
                            <th>Plan</th>
                            <th>Rate</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-tbody">
                        <tr><td colspan="6" style="text-align: center;">No bookings</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script>
        function loadBookings() {
            if (!requireLogin()) return;

            const user = getCurrentUser();
            if (normalizeRole(user.role) !== 'admin') {
                window.location.href = 'dashboard.html';
                return;
            }

            const bookings = getBookings();
            const tbody = document.getElementById('bookings-tbody');

            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No bookings</td></tr>';
                return;
            }

            tbody.innerHTML = bookings.map(b => `
                <tr>
                    <td>${b.helperName}</td>
                    <td>${b.serviceType}</td>
                    <td>${b.planType}</td>
                    <td>₹${b.rate}</td>
                    <td><span class="badge badge-${b.status === 'Active' ? 'success' : b.status === 'Pending' ? 'warning' : 'info'}">${b.status}</span></td>
                    <td>${new Date(b.createdAt).toLocaleDateString()}</td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadBookings);
    </script>

    <footer>
        <p>&copy; 2024 Maid & Nanny Service Management Platform</p>
    </footer>
</body>
</html>
